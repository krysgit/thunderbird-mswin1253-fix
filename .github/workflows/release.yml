name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match manifest version $VERSION"
            exit 1
          fi

      - name: Build XPI
        run: bash scripts/build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          XPI="dist/mswin1253-greek-fix-v${VERSION}.xpi"
          gh release create "v${VERSION}" "$XPI"             --title "MSWIN1253 Greek Fix v${VERSION}"             --generate-notes
